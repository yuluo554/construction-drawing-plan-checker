name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 让 CI 内所有 python 进程默认 UTF-8（CI 的 windows 腿曾三次因代码页非 UTF-8 而红）。
# 注意：这只覆盖 CI；产品侧仍必须自己处理编码（app/console.py），
# 因为真实用户在自己机器的 cmd 里不会设这个变量。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 钉具体版本：`ubuntu-latest` 自 2026-10-19 起迁移到 Ubuntu 26，
        # 会让每次 run 都挂一条迁移提示注解（且基础镜像随时可变）。
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Show resolved app path and version
        run: python -c "import app, importlib.metadata as m; print('app at', app.__file__); print('version', m.version('construction-drawing-plan-checker'))"

      - name: pytest
        run: python -m pytest -q

      - name: CLI --help
        working-directory: code/backend
        run: python -m app.cli --help

      # CLI 退出码门（D1）：输入不存在必须非 0（2）。Actions 的 bash 在非零时
      # 直接失败，所以这里显式取码再断言。
      - name: CLI exit code gate (missing input must fail)
        shell: bash
        working-directory: code/backend
        run: |
          set +e
          python -m app.cli drawing ./no-such-file.dxf >/dev/null 2>&1
          rc=$?
          set -e
          echo "drawing(missing) rc=$rc"
          test "$rc" -eq 2 || { echo "FAIL: 期望 2，得到 $rc"; exit 1; }

      - name: bench drawings (30 张, seed 1)
        working-directory: code/backend
        run: python tools/bench_drawings.py 30 1

      - name: bench consistency (15 组, seed 1)
        working-directory: code/backend
        run: python tools/bench_consistency.py 15 1

      - name: bench rag (offline, frozen query vectors)
        working-directory: code/backend
        run: python tools/bench_rag.py

      # 单行书写：Windows 默认 shell 是 pwsh，反斜杠续行会被当成独立命令
      - name: End-to-end run (rule channel, no API key)
        working-directory: code/backend
        run: python -m app.cli run "../../data/施工图纸/自制样例/sample_beam_plan.dxf" "../../data/施工方案/自制样例/sample_formwork_plan_13.docx" -o "${{ runner.temp }}/e2e-out"

      # 产物断言：输出保持纯 ASCII —— 该步骤是独立 python 进程，Windows 默认代码页
# 不是 UTF-8；产物文件名本身是中文，直接 print 文件名会在成功路径上抛
# UnicodeEncodeError（CI 实际发生过两次）。这里只打印"计数 + ASCII 转义名"。
      - name: Assert e2e artifacts exist
        shell: python
        env:
          OUT_DIR: ${{ runner.temp }}/e2e-out
        run: |
          import os, sys

          def ascii(s):
              return s.encode("ascii", "backslashreplace").decode("ascii")

          out = os.environ["OUT_DIR"]
          names = sorted(os.listdir(out)) if os.path.isdir(out) else []
          got_json = [n for n in names if n.endswith(".json")]
          got_docx = [n for n in names if n.endswith(".docx")]
          print("json=%d docx=%d total=%d" % (len(got_json), len(got_docx), len(names)))
          for n in names:
              print("  " + ascii(n))
          if not (got_json and got_docx):
              print("FAIL: missing artifacts")
              sys.exit(1)
          print("OK: both artifact kinds present")

  package:
    name: package (build wheel/sdist)
    # 与 test 矩阵保持同一基础镜像（`ubuntu-latest` 会挂迁移注解且随时漂移）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install build

      - name: Build
        run: python -m build

      - name: Report artifacts
        run: ls -l dist/

      - name: Install from wheel and smoke-test the console script
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import importlib.metadata as m; print('installed', m.version('construction-drawing-plan-checker'))"
          construction-check --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
