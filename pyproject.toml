[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-drawing-plan-checker"
version = "0.1.1"
description = "施工图 × 施工方案 协同智能校核：参数卡解析、一致性比对、危大合规判定、规范条文 RAG 与 DOCX 报告"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["construction", "drawing-review", "rule-engine", "compliance", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Construction",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ezdxf>=1.1",
    "PyMuPDF>=1.24",
    "python-docx>=1.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 测试与基准脚本所需（原 code/requirements.txt 把 pytest 混在运行依赖里，已拆出）
dev = ["pytest>=7.4"]

[project.scripts]
construction-check = "app.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/construction-drawing-plan-checker"
Repository = "https://github.com/yuluo554/construction-drawing-plan-checker"

[tool.setuptools]
# 源码布局：Python 包在 code/backend/app。
# 运行期资产（知识库 / 危大阈值清单 / Web 静态文件 / 规则元数据）由 setup.py 的
# build_py 钩子复制到 app/_data/，再经下面的 package-data 打进 wheel 与 sdist——
# 保证 `pip install`（非 editable）之后 compliance / --rag / Web 都能真跑。
package-dir = { "" = "code/backend" }

[tool.setuptools.packages.find]
where = ["code/backend"]
include = ["app*"]

[tool.setuptools.package-data]
# app/_data 是构建产物（不入库）；这里只声明"要收进包"的模式。
app = ["_data/**/*", "_data/**/**/*"]

[tool.pytest.ini_options]
testpaths = ["code/backend/tests"]
addopts = "-ra"
markers = [
    # 慢测试：真构建 wheel + 建临时 venv + 真装。默认也跑；CI 的 packaging job 必须显式跑。
    "packaging: 安装态/打包相关（构建 wheel、临时 venv、仓库外执行）",
]
